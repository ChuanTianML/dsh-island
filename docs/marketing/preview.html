<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DSH Island marketing preview</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
        --ink: #f6f2e9;
        --muted: #8d98aa;
        --panel: rgba(9, 13, 21, 0.88);
        --line: rgba(255, 255, 255, 0.09);
        --amber: #ffb84d;
        --coral: #ff6660;
        --cyan: #55d6ff;
        --mint: #61e6a5;
      }

      * { box-sizing: border-box; }

      [hidden] { display: none !important; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05070b;
      }

      body {
        position: relative;
        color: var(--ink);
      }

      .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 72% 6%, rgba(85, 214, 255, 0.16), transparent 31%),
          radial-gradient(circle at 12% 84%, rgba(255, 184, 77, 0.13), transparent 28%),
          linear-gradient(145deg, #080b12 0%, #030509 57%, #091019 100%);
      }

      .scene::before {
        position: absolute;
        inset: 0;
        content: "";
        opacity: 0.34;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: linear-gradient(to bottom, black, transparent 92%);
      }

      .ambient-line {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(
          90deg,
          transparent 0 8%,
          var(--amber) 8% 29%,
          var(--coral) 29% 50%,
          var(--cyan) 50% 72%,
          var(--mint) 72% 92%,
          transparent 92%
        );
        filter: drop-shadow(0 0 10px rgba(85, 214, 255, 0.35));
      }

      .workspace {
        position: absolute;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: rgba(6, 9, 14, 0.86);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.52);
      }

      .window-bar {
        display: flex;
        height: 48px;
        align-items: center;
        gap: 9px;
        padding: 0 17px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.018);
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
      }

      .window-title {
        margin-left: 10px;
        color: rgba(246, 242, 233, 0.42);
        font-size: 10px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .workspace-grid {
        display: grid;
        height: calc(100% - 48px);
        grid-template-columns: 190px minmax(0, 1fr) 244px;
      }

      .sidebar,
      .telemetry {
        padding: 24px 20px;
        background: rgba(255, 255, 255, 0.012);
      }

      .sidebar { border-right: 1px solid var(--line); }
      .telemetry { border-left: 1px solid var(--line); }

      .section-label {
        margin-bottom: 18px;
        color: rgba(246, 242, 233, 0.34);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.18em;
      }

      .tree-row {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 11px 0;
        color: rgba(246, 242, 233, 0.48);
        font-size: 10px;
      }

      .tree-row.active { color: var(--cyan); }

      .tree-icon {
        width: 8px;
        height: 8px;
        border: 1px solid currentColor;
        border-radius: 2px;
        opacity: 0.66;
      }

      .editor {
        position: relative;
        padding: 28px 34px;
      }

      .editor-tab {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 28px;
        padding: 8px 12px;
        border: 1px solid rgba(85, 214, 255, 0.14);
        border-radius: 7px;
        color: rgba(246, 242, 233, 0.62);
        background: rgba(85, 214, 255, 0.04);
        font-size: 10px;
      }

      .code-line {
        display: grid;
        grid-template-columns: 28px 1fr;
        min-height: 25px;
        color: rgba(246, 242, 233, 0.52);
        font-size: 11px;
        line-height: 1.55;
      }

      .line-number { color: rgba(246, 242, 233, 0.16); }
      .code-key { color: var(--coral); }
      .code-type { color: var(--cyan); }
      .code-value { color: var(--mint); }
      .code-note { color: var(--amber); }

      .metric {
        margin-bottom: 12px;
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.018);
      }

      .metric-value {
        margin-bottom: 5px;
        color: var(--ink);
        font-family: ui-serif, Georgia, serif;
        font-size: 22px;
        font-weight: 700;
      }

      .metric-label {
        color: rgba(246, 242, 233, 0.34);
        font-size: 8px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .privacy-badge {
        position: absolute;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: rgba(246, 242, 233, 0.42);
        font-size: 9px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      .privacy-badge::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--mint);
        box-shadow: 0 0 12px rgba(97, 230, 165, 0.6);
        content: "";
      }

      .product-image {
        display: block;
        filter: drop-shadow(0 26px 45px rgba(0, 0, 0, 0.46));
      }

      .desktop-layout .workspace {
        inset: 118px 84px 58px;
      }

      .desktop-layout .product-image {
        position: absolute;
        z-index: 3;
        top: 30px;
        left: 50%;
        width: 540px;
        transform: translateX(-50%);
      }

      .desktop-layout .privacy-badge {
        right: 96px;
        bottom: 30px;
      }

      .desktop-brand {
        position: absolute;
        z-index: 2;
        left: 90px;
        top: 40px;
        display: flex;
        align-items: baseline;
        gap: 16px;
      }

      .desktop-brand strong {
        font-family: ui-serif, Georgia, serif;
        font-size: 22px;
        letter-spacing: -0.02em;
      }

      .desktop-brand span {
        color: var(--muted);
        font-size: 9px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .social-layout {
        display: grid;
        grid-template-columns: 47% 53%;
        padding: 72px 76px 58px;
      }

      .social-copy {
        position: relative;
        z-index: 4;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-right: 34px;
      }

      .eyebrow {
        margin-bottom: 26px;
        color: var(--cyan);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.19em;
        text-transform: uppercase;
      }

      .social-copy h1 {
        max-width: 540px;
        margin: 0;
        font-family: ui-serif, Georgia, "Times New Roman", serif;
        font-size: 66px;
        line-height: 0.96;
        letter-spacing: -0.045em;
      }

      .social-copy p {
        max-width: 430px;
        margin: 27px 0 0;
        color: rgba(246, 242, 233, 0.58);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 18px;
        line-height: 1.55;
      }

      .status-key {
        display: flex;
        gap: 20px;
        margin-top: 31px;
      }

      .status-key span {
        position: relative;
        padding-left: 14px;
        color: rgba(246, 242, 233, 0.46);
        font-size: 9px;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      .status-key span::before {
        position: absolute;
        top: 2px;
        left: 0;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }

      .status-key .attention { color: var(--amber); }
      .status-key .working { color: var(--cyan); }
      .status-key .complete { color: var(--mint); }

      .social-product {
        position: relative;
        z-index: 3;
      }

      .social-product .workspace {
        inset: 28px -24px 18px 4px;
        opacity: 0.76;
      }

      .social-product .workspace-grid {
        grid-template-columns: 125px 1fr;
      }

      .social-product .telemetry { display: none; }
      .social-product .sidebar { padding: 18px 14px; }
      .social-product .editor { padding: 20px; }
      .social-product .product-image {
        position: absolute;
        z-index: 5;
        top: 82px;
        left: 50%;
        width: 500px;
        transform: translateX(-47%);
      }

      .social-product .collapsed-accent {
        position: absolute;
        z-index: 6;
        top: 420px;
        right: -3px;
        width: 330px;
        opacity: 0.7;
        filter: blur(0.1px) drop-shadow(0 20px 28px rgba(0, 0, 0, 0.44));
      }

      .demo-layout .workspace {
        inset: 70px 64px 66px;
        opacity: 0.78;
      }

      .demo-layout .product-image {
        position: absolute;
        z-index: 5;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
      }

      .demo-layout[data-state="working"] .product-image,
      .demo-layout[data-state="attention"] .product-image {
        width: 400px;
      }

      .demo-layout[data-state="expanding"] .product-frame {
        position: absolute;
        z-index: 5;
        top: 30px;
        left: 50%;
        width: 460px;
        height: 244px;
        overflow: hidden;
        border-radius: 30px;
        transform: translateX(-50%);
        filter: drop-shadow(0 26px 45px rgba(0, 0, 0, 0.46));
      }

      .demo-layout[data-state="expanding"] .product-frame .product-image {
        position: static;
        width: 460px;
        transform: none;
        filter: none;
      }

      .demo-layout[data-state="expanded"] .product-image {
        width: 500px;
      }

      .attention-pulse {
        position: absolute;
        z-index: 4;
        top: 22px;
        left: 50%;
        width: 422px;
        height: 84px;
        border: 1px solid rgba(255, 184, 77, 0.46);
        border-radius: 44px;
        transform: translateX(-50%);
        box-shadow: 0 0 0 12px rgba(255, 184, 77, 0.035), 0 0 52px rgba(255, 184, 77, 0.18);
      }

      .demo-layout:not([data-state="attention"]) .attention-pulse { display: none; }

      .demo-caption {
        position: absolute;
        z-index: 6;
        left: 50%;
        bottom: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 15px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: rgba(246, 242, 233, 0.62);
        background: rgba(4, 7, 11, 0.84);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.34);
        font-size: 9px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        transform: translateX(-50%);
      }

      .demo-caption::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--caption-color, var(--cyan));
        box-shadow: 0 0 12px var(--caption-color, var(--cyan));
        content: "";
      }

      .demo-layout[data-state="attention"] .demo-caption,
      .demo-layout[data-state="expanding"] .demo-caption {
        --caption-color: var(--amber);
      }

      .demo-layout[data-state="expanded"] .demo-caption {
        --caption-color: var(--mint);
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <div class="ambient-line"></div>
      <section class="desktop-layout" hidden>
        <div class="desktop-brand">
          <strong>DSH Island</strong>
          <span>Every agent · one glance</span>
        </div>
        <div class="workspace"></div>
        <img class="product-image" src="../assets/dsh-island-expanded.png" alt="">
        <div class="privacy-badge">Synthetic demo data · no telemetry</div>
      </section>

      <section class="social-layout" hidden>
        <div class="social-copy">
          <div class="eyebrow">DSH Island · macOS</div>
          <h1>Every agent.<br>One glance.</h1>
          <p>A lightweight status island for every DeepSeek Harness session.</p>
          <div class="status-key">
            <span class="attention">Needs you</span>
            <span class="working">Working</span>
            <span class="complete">Complete</span>
          </div>
        </div>
        <div class="social-product">
          <div class="workspace"></div>
          <img class="product-image" src="../assets/dsh-island-expanded.png" alt="">
          <img class="collapsed-accent" src="../assets/dsh-island-collapsed.png" alt="">
        </div>
      </section>

      <section class="demo-layout" hidden>
        <div class="workspace"></div>
        <div class="attention-pulse"></div>
        <div class="product-frame">
          <img class="product-image" alt="">
        </div>
        <div class="demo-caption"></div>
      </section>
    </main>

    <template id="workspace-template">
      <div class="window-bar">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="window-title">Status lab · privacy-safe fixture</span>
      </div>
      <div class="workspace-grid">
        <aside class="sidebar">
          <div class="section-label">Workspace</div>
          <div class="tree-row"><span class="tree-icon"></span> Sources</div>
          <div class="tree-row active"><span class="tree-icon"></span> IslandView.swift</div>
          <div class="tree-row"><span class="tree-icon"></span> StatusEngine.swift</div>
          <div class="tree-row"><span class="tree-icon"></span> DemoTests.swift</div>
          <div class="tree-row"><span class="tree-icon"></span> README.md</div>
        </aside>
        <div class="editor">
          <div class="editor-tab"><span class="tree-icon"></span> fleet-status.swift</div>
          <div class="code-line"><span class="line-number">01</span><span><span class="code-key">let</span> fleet = <span class="code-type">SessionFleet</span>.visible</span></div>
          <div class="code-line"><span class="line-number">02</span><span></span></div>
          <div class="code-line"><span class="line-number">03</span><span><span class="code-key">for</span> session <span class="code-key">in</span> fleet {</span></div>
          <div class="code-line"><span class="line-number">04</span><span>&nbsp;&nbsp;status.publish(session.<span class="code-value">activity</span>)</span></div>
          <div class="code-line"><span class="line-number">05</span><span>&nbsp;&nbsp;<span class="code-key">if</span> session.<span class="code-note">needsAttention</span> {</span></div>
          <div class="code-line"><span class="line-number">06</span><span>&nbsp;&nbsp;&nbsp;&nbsp;island.surface(session)</span></div>
          <div class="code-line"><span class="line-number">07</span><span>&nbsp;&nbsp;}</span></div>
          <div class="code-line"><span class="line-number">08</span><span>}</span></div>
        </div>
        <aside class="telemetry">
          <div class="section-label">Agent fleet</div>
          <div class="metric"><div class="metric-value">04</div><div class="metric-label">Visible sessions</div></div>
          <div class="metric"><div class="metric-value" style="color: var(--cyan)">01</div><div class="metric-label">Working now</div></div>
          <div class="metric"><div class="metric-value" style="color: var(--mint)">01</div><div class="metric-label">Recently settled</div></div>
        </aside>
      </div>
    </template>

    <script>
      const params = new URLSearchParams(location.search);
      const mode = params.get("mode") || "desktop";
      const state = params.get("state") || "working";
      const workspaceTemplate = document.querySelector("#workspace-template");

      for (const workspace of document.querySelectorAll(".workspace")) {
        workspace.append(workspaceTemplate.content.cloneNode(true));
      }

      const layout = document.querySelector(`.${mode}-layout`);
      layout.hidden = false;

      if (mode === "demo") {
        layout.dataset.state = state;
        const image = layout.querySelector(".product-image");
        const caption = layout.querySelector(".demo-caption");
        const states = {
          working: {
            image: "../assets/dsh-island-working.png",
            caption: "Three agents keep working while you stay in flow",
          },
          attention: {
            image: "../assets/dsh-island-collapsed.png",
            caption: "One session needs you",
          },
          expanding: {
            image: "../assets/dsh-island-expanded.png",
            caption: "One click opens the whole fleet",
          },
          expanded: {
            image: "../assets/dsh-island-expanded.png",
            caption: "Attention, failure, progress, and completion",
          },
        };
        image.src = states[state].image;
        caption.textContent = states[state].caption;
      }
    </script>
  </body>
</html>
